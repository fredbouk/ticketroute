name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install project dependencies
        # Match the Dockerfile's CPU-only PyTorch to avoid large CUDA packages.
        # Skip pip's download cache to leave disk space for the Docker build.
        run: |
          python -m pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir -r requirements.txt

      - name: Run tests with mocked AI responses
        run: python -m pytest -q

      - name: Build Docker image without publishing
        run: docker build --tag ticketroute:ci .
